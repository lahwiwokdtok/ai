<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>XAYA AI — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./admin.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="./config.js" onerror="window.__CONFIG_LOAD_FAILED = true"></script>
</head>
<body>

<!-- ===================== LOGIN GATE ===================== -->
<div id="admin-login-screen">
  <div class="admin-login-card">
    <div class="admin-brand">
      <h1>XAYA <span>AI</span></h1>
      <p>Admin Panel</p>
    </div>
    <div class="admin-box">
      <div class="a-error" id="admin-error"></div>
      <div class="a-field">
        <label>Username</label>
        <input id="admin-username" type="text" placeholder="username" autocomplete="username" />
      </div>
      <div class="a-field">
        <label>Password</label>
        <input id="admin-password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="a-submit" id="admin-submit">Masuk</button>
    </div>
  </div>
</div>

<!-- ===================== ADMIN SHELL ===================== -->
<div id="admin-shell">
  <div class="a-topbar">
    <h1>XAYA <span>Admin</span></h1>
    <div class="a-topbar-right">
      <span class="a-admin-chip" id="admin-whoami"></span>
      <button class="a-logout" id="admin-logout">
        <svg class="icon" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Keluar
      </button>
    </div>
  </div>

  <div class="a-tabs">
    <button class="a-tab active" data-tab="dashboard">
      <svg class="icon" style="width:15px;height:15px" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      Dashboard
    </button>
    <button class="a-tab" data-tab="withdrawals">
      <svg class="icon" style="width:15px;height:15px" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3"/></svg>
      Penarikan <span class="badge" id="badge-withdrawals" style="display:none;">0</span>
    </button>
    <button class="a-tab" data-tab="users">
      <svg class="icon" style="width:15px;height:15px" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><circle cx="17" cy="8" r="3"/><path d="M22 21c0-3-2-5.5-5-6.5"/></svg>
      Pengguna
    </button>
    <button class="a-tab" data-tab="content">
      <svg class="icon" style="width:15px;height:15px" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 4v16M16 4v16M2 9h6M2 15h6M16 9h6M16 15h6"/></svg>
      Konten
    </button>
  </div>

  <div class="a-content">

    <!-- ---------- DASHBOARD ---------- -->
    <div class="a-view active" data-view="dashboard">
      <div class="a-stats-grid" id="stats-grid">
        <div class="a-loading">Memuat statistik...</div>
      </div>
    </div>

    <!-- ---------- WITHDRAWALS ---------- -->
    <div class="a-view" data-view="withdrawals">
      <div class="a-toolbar">
        <button class="a-filter-chip active" data-wd-filter="pending">Menunggu</button>
        <button class="a-filter-chip" data-wd-filter="success">Selesai</button>
        <button class="a-filter-chip" data-wd-filter="rejected">Ditolak</button>
        <button class="a-filter-chip" data-wd-filter="all">Semua</button>
      </div>
      <div class="a-list" id="withdrawals-list">
        <div class="a-loading">Memuat...</div>
      </div>
    </div>

    <!-- ---------- USERS ---------- -->
    <div class="a-view" data-view="users">
      <div class="a-toolbar">
        <input class="a-search" id="user-search" placeholder="Cari username..." />
      </div>
      <div class="a-list" id="users-list">
        <div class="a-loading">Memuat...</div>
      </div>
    </div>

    <!-- ---------- CONTENT MODERATION ---------- -->
    <div class="a-view" data-view="content">
      <div class="a-toolbar">
        <button class="a-filter-chip active" data-content-filter="videos">Video</button>
        <button class="a-filter-chip" data-content-filter="statuses">Status</button>
      </div>
      <div class="a-media-grid" id="content-grid">
        <div class="a-loading">Memuat...</div>
      </div>
    </div>

  </div>
</div>

<!-- ===================== MODALS ===================== -->
<div class="a-modal-overlay" id="modal-reject">
  <div class="a-modal">
    <h3>Tolak permintaan penarikan?</h3>
    <div class="a-field">
      <label>Alasan (opsional)</label>
      <input id="reject-note" type="text" placeholder="mis. data rekening tidak valid" />
    </div>
    <p style="font-size:12px; color:var(--text-dim);">Saldo user akan dikembalikan otomatis.</p>
    <div class="a-modal-actions">
      <button class="a-modal-cancel" id="reject-cancel">Batal</button>
      <button class="a-modal-confirm danger" id="reject-confirm">Tolak</button>
    </div>
  </div>
</div>

<div class="a-modal-overlay" id="modal-balance">
  <div class="a-modal">
    <h3>Ubah saldo user</h3>
    <div class="a-field">
      <label>Saldo baru (Rp)</label>
      <input id="balance-input" type="number" min="0" placeholder="0" />
    </div>
    <div class="a-modal-actions">
      <button class="a-modal-cancel" id="balance-cancel">Batal</button>
      <button class="a-modal-confirm" id="balance-confirm">Simpan</button>
    </div>
  </div>
</div>

<div class="a-modal-overlay" id="modal-verify">
  <div class="a-modal">
    <h3 id="verify-modal-title">Centang biru</h3>
    <div class="a-field">
      <label>Label verified (tampil menggantikan nama)</label>
      <input id="verify-label-input" type="text" placeholder="mis. DEV XAYA" />
    </div>
    <div class="a-modal-actions">
      <button class="a-modal-cancel" id="verify-cancel">Batal</button>
      <button class="a-modal-confirm" id="verify-confirm">Kasih Centang</button>
    </div>
    <div class="a-modal-actions">
      <button class="a-modal-confirm danger" id="verify-remove" style="width:100%">Cabut Centang</button>
    </div>
  </div>
</div>

<div class="a-modal-overlay" id="modal-notify">
  <div class="a-modal">
    <h3 id="notify-modal-title">Kirim notifikasi</h3>
    <div class="a-field">
      <label>Pesan</label>
      <input id="notify-message-input" type="text" placeholder="Tulis pesan notifikasi..." />
    </div>
    <div class="a-modal-actions">
      <button class="a-modal-cancel" id="notify-cancel">Batal</button>
      <button class="a-modal-confirm" id="notify-confirm">Kirim</button>
    </div>
  </div>
</div>

<div class="a-modal-overlay" id="modal-confirm-generic">
  <div class="a-modal">
    <h3 id="generic-modal-title">Konfirmasi</h3>
    <p id="generic-modal-body" style="font-size:13px; color:var(--text-dim);"></p>
    <div class="a-modal-actions">
      <button class="a-modal-cancel" id="generic-cancel">Batal</button>
      <button class="a-modal-confirm danger" id="generic-confirm">Ya, lanjutkan</button>
    </div>
  </div>
</div>

<div class="a-toast" id="admin-toast"></div>

<script type="module" src="./admin.js"></script>
</body>
</html>
